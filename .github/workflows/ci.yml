name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm lint:vocabulary
      - run: sh scripts/check-vocabulary.test.sh
      - run: pnpm depcruise
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  adapters:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: varda
          POSTGRES_PASSWORD: varda
          POSTGRES_DB: varda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U varda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://varda:varda@localhost:5432/varda
      BETTER_AUTH_SECRET: ci-only-secret-of-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:adapters
