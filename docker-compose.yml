# Local development services. Start with `pnpm db:up`.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: varda
      POSTGRES_PASSWORD: varda
      POSTGRES_DB: varda
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      # Creates varda_test, the test suites' database, next to varda (first start only).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres:
